<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>screensmart — המערכת בשידרוג</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Secular+One&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0b1c3a;
      --navy-deep: #061225;
      --navy-mid: #14305a;
      --gold: #c9a227;
      --gold-bright: #e0b93a;
      --paper: #f4f6f9;
      --muted: #6b7c8f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Heebo, Rubik, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201, 162, 39, 0.18), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 90%, rgba(20, 48, 90, 0.9), transparent 50%),
        linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 45%, var(--navy-mid) 100%);
      padding: 1.5rem;
    }
    .card {
      width: min(520px, 100%);
      text-align: center;
      padding: 2.5rem 1.75rem 2rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(201, 162, 39, 0.35);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }
    .brand {
      font-family: 'Secular One', Heebo, sans-serif;
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      letter-spacing: 0.02em;
      color: #fff;
      margin-bottom: 0.35rem;
    }
    .brand span { color: var(--gold-bright); }
    .kicker {
      display: inline-block;
      margin: 1.25rem 0 0.85rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--navy-deep);
      background: linear-gradient(90deg, var(--gold), var(--gold-bright));
    }
    h1 {
      font-size: clamp(1.35rem, 4vw, 1.7rem);
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 0.75rem;
    }
    p {
      color: rgba(255, 255, 255, 0.78);
      font-size: 1.05rem;
      line-height: 1.65;
      margin-bottom: 0.5rem;
    }
    .pulse {
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      margin: 1.5rem 0 1.75rem;
    }
    .pulse i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold-bright);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .pulse i:nth-child(2) { animation-delay: 0.15s; }
    .pulse i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }
    .contact {
      margin-top: 0.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    .contact a {
      color: var(--gold-bright);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.15rem;
      direction: ltr;
      display: inline-block;
    }
    .contact a:hover { text-decoration: underline; }
    .hint {
      margin-top: 0.55rem;
      font-size: 0.9rem;
      color: var(--muted);
      color: rgba(255, 255, 255, 0.55);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">screen<span>smart</span></div>
    <div class="kicker">תחזוקה מתוכננת</div>
    <h1>המערכת בשידרוג כרגע</h1>
    <p>אנחנו מעדכנים את המערכת לגרסה חדשה.<br />השירות יחזור לפעילות בעוד כמה דקות.</p>
    <div class="pulse" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="contact">
      <p class="hint">לשאלות וסיוע:</p>
      <a href="tel:0524521527">052-4521527</a>
      <p class="hint" style="margin-top:0.65rem">screensmart.co.il</p>
    </div>
  </main>
</body>
</html>
