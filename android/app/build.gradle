apply plugin: 'com.android.application'

android {
    namespace = "il.screensmart.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "0.3.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Overridden per flavor
        applicationId "il.screensmart.app"
        buildConfigField "boolean", "IS_MANAGE_APP", "false"
        manifestPlaceholders = [screenOrientation: "sensorLandscape"]
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    flavorDimensions "shell"
    productFlavors {
        kiosk {
            dimension "shell"
            applicationId "il.screensmart.app"
            resValue "string", "app_name", "screensmart"
            resValue "string", "title_activity_main", "screensmart"
            buildConfigField "boolean", "IS_MANAGE_APP", "false"
            manifestPlaceholders = [screenOrientation: "sensorLandscape"]
        }
        manage {
            dimension "shell"
            applicationId "il.screensmart.manage"
            resValue "string", "app_name", "screensmart ניהול"
            resValue "string", "title_activity_main", "screensmart ניהול"
            buildConfigField "boolean", "IS_MANAGE_APP", "true"
            manifestPlaceholders = [screenOrientation: "portrait"]
            versionCode 1
            versionName "1.0.0"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def flavor = variant.flavorName ?: "default"
            def buildType = variant.buildType.name
            output.outputFileName = "screensmart-${flavor}-${buildType}-${variant.versionName}.apk"
        }
    }
}

tasks.configureEach { task ->
    if (task.name != "assembleManageDebug") return
    task.doLast {
        def apkDir = layout.buildDirectory.dir("outputs/apk/manage/debug").get().asFile
        def dest = rootProject.file("../releases/android-manage")
        dest.mkdirs()
        copy {
            from apkDir
            include "*.apk", "output-metadata.json"
            into dest
        }
        def desktop = new File(System.getProperty("user.home"), "OneDrive/Desktop")
        if (desktop.exists()) {
            copy {
                from apkDir
                include "*.apk"
                into desktop
                rename { String _ -> "screensmart-manage-debug.apk" }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
