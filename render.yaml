# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Note: a persistent disk disables Render zero-downtime deploys.
# For planned upgrades, enable Maintenance Mode on shul-screen and point
# the custom page URI to the screensmart-status static site below.
services:
  - type: web
    name: shul-screen
    runtime: node
    # Disk requires paid plan (Starter+). Free cannot attach persistent disks.
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: shul-media
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      # All durable files (media uploads) live on the attached disk
      - key: DATA_DIR
        value: /var/data
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PLATFORM_ADMIN_USER
        sync: false
      - key: VITE_PLATFORM_ADMIN_PASSWORD
        sync: false
      # Durable synagogue JSON (GitHub Contents API)
      - key: CLOUD_GITHUB_TOKEN
        sync: false
      - key: CLOUD_GITHUB_REPO
        value: stech-il/shul-screen-data
      - key: CLOUD_GITHUB_BRANCH
        value: main
      # SUMIT billing (הוראת קבע)
      - key: SUMIT_COMPANY_ID
        sync: false
      - key: SUMIT_API_KEY
        sync: false
      - key: SUMIT_API_PUBLIC_KEY
        sync: false
      # SMTP — trial / payment email alerts
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false

  # Branded maintenance page (host separately so it stays up while main service is offline)
  - type: web
    name: screensmart-status
    runtime: static
    region: frankfurt
    buildCommand: 'true'
    staticPublishPath: ./maintenance
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
