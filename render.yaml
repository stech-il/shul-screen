# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: shul-screen
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PLATFORM_ADMIN_USER
        sync: false
      - key: VITE_PLATFORM_ADMIN_PASSWORD
        sync: false
      # Durable cloud DB (GitHub Contents API) — required so redeploys keep synagogue data
      - key: CLOUD_GITHUB_TOKEN
        sync: false
      - key: CLOUD_GITHUB_REPO
        value: stech-il/shul-screen-data
      - key: CLOUD_GITHUB_BRANCH
        value: main
      # SUMIT billing (הוראת קבע) — from SUMIT dashboard: Settings → API
      - key: SUMIT_COMPANY_ID
        sync: false
      - key: SUMIT_API_KEY
        sync: false
      - key: SUMIT_API_PUBLIC_KEY
        sync: false
